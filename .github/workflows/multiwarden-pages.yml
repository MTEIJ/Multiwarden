# Multiwarden: publishes the project page (multiwarden/site) to GitHub Pages.
# Releases are read live from the GitHub API, so the page doesn't need rebuilding per release.
name: Multiwarden Pages

on:
  push:
    branches: [main]
    paths:
      - "multiwarden/site/**"
      - "multiwarden/branding/icons/logo512.png"
      - ".github/workflows/multiwarden-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r multiwarden/site/. _site/
          cp multiwarden/branding/icons/logo512.png _site/logo.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
