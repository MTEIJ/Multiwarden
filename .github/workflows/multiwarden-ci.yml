# Multiwarden: tests the Multiwarden changes and builds the extension for every browser.
# It publishes a GitHub release with one zip per browser when started from the Actions tab with
# "release" ticked (it then creates the tag itself), or when a tag like v2026.11.0.1 is pushed.
#
# Release checklist: bump "release" in multiwarden/version.json and commit, then run this
# workflow on main with "release" ticked. The tag is v<bitwarden version>.<release>.
name: Multiwarden CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (creates the version tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # Upstream's lock file is occasionally out of step with package.json.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Check translations
        run: node multiwarden/scripts/check-translations.mjs

      - name: Lint Multiwarden code
        run: |
          npx eslint libs/common/src/multiwarden libs/angular/src/multiwarden \
            apps/browser/src/multiwarden apps/browser/src/autofill/multiwarden
          npx prettier --check libs/common/src/multiwarden libs/angular/src/multiwarden \
            apps/browser/src/multiwarden apps/browser/src/autofill/multiwarden multiwarden/scripts

      - name: Test Multiwarden changes
        run: |
          (cd libs/common && npx jest src/multiwarden src/platform/services/fido2)
          (cd libs/angular && npx jest src/multiwarden)
          (cd libs/tools/send/send-ui && npx jest)
          (cd apps/browser && npx jest --runInBand \
            src/multiwarden \
            src/autofill/multiwarden \
            src/autofill/browser \
            src/autofill/services/autofill-badge-updater.service.spec.ts \
            src/vault/popup/services \
            src/tools/popup \
            src/vault/popup/components/vault/vault-list-items-container \
            src/vault/popup/components/vault/vault-popup-list-table \
            src/vault/popup/components/vault/view \
            src/vault/popup/components/vault/add-edit \
            src/auth/popup/account-switching \
            src/popup \
            src/autofill/background/notification.background.spec.ts \
            src/autofill/background/overlay.background.spec.ts \
            src/autofill/background/autofill-orchestrator.spec.ts \
            src/autofill/services/autofill.service.spec.ts \
            src/autofill/notification \
            src/autofill/content/components/notification \
            src/autofill/fido2 \
            src/autofill/popup/fido2)

  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            manifest: "3"
          - browser: edge
            manifest: "3"
          - browser: opera
            manifest: "3"
          - browser: firefox
            manifest: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (open-source build only)
        working-directory: apps/browser
        env:
          NODE_ENV: production
          BROWSER: ${{ matrix.browser }}
          MANIFEST_VERSION: ${{ matrix.manifest }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx webpack

      - name: Apply Multiwarden branding and package
        run: |
          node multiwarden/scripts/brand-build.mjs apps/browser/build
          version="$(node -p "require('./apps/browser/build/manifest.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          (cd apps/browser/build && zip -qr "../../../multiwarden-${{ matrix.browser }}-$version.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: multiwarden-${{ matrix.browser }}
          path: multiwarden-${{ matrix.browser }}-${{ env.VERSION }}.zip

  build-safari:
    name: Build safari (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (open-source build only)
        working-directory: apps/browser
        env:
          NODE_ENV: production
          BROWSER: safari
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx webpack

      - name: Apply Multiwarden branding
        run: |
          node multiwarden/scripts/brand-build.mjs apps/browser/build
          version="$(node -p "require('./apps/browser/build/manifest.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package unsigned Safari app
        run: |
          bash multiwarden/scripts/package-safari-unsigned.sh \
            "$GITHUB_WORKSPACE/multiwarden-safari-unsigned-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: multiwarden-safari
          path: multiwarden-safari-unsigned-${{ env.VERSION }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, build, build-safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is in the zip names: multiwarden-<browser>-<version>.zip
          version="$(ls dist/multiwarden-chrome-*.zip | sed -E 's/.*multiwarden-chrome-(.*)\.zip/\1/')"
          tag="v${version}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"release\" in multiwarden/version.json first."
            exit 1
          fi
          gh release create "$tag" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Multiwarden ${version}" --generate-notes
